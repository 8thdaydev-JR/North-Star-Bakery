            <figure>
            <h2>Our Story</h2>
                <img src="images/bakery-storefront_c.png" width="700" height="auto">
                <p>At North Star Bakery, we believe a great community is built on the little things: a warm loaf of bread, a fresh pastry on the way to work,<br>
                and a delicious cake shared with family and friends. Founded on a passion for homemade goodness and bringing people together, our bakery takes<br>
                pride in serving fresh, handcrafted baked goods made with care. Whether you're a longtime local or just passing through,<br>
                we're happy to welcome you in and make you feel at home.
                </p>
                <p>We know life can get busy, which is why we strive to make every visit convenient, enjoyable, and worthwhile.<br>
                Stop by on your morning commute for a freshly baked croissant and a cup of coffee, pick up a sweet treat for the family, or surprise someone with<br>
                one of our specialty cakes. From everyday favorites to seasonal creations, we offer something for everyone,<br>
                with quality and freshness at the heart of everything we make.
                </p>
                <p>At North Star Bakery, we're more than just a place to buy baked goods; we're a part of the community we proudly serve. Whether you're planning a<br>
                birthday party, organizing a church gathering, hosting a family celebration, or coordinating a special event, we're here to help make the occasion<br>
                a little sweeter. Thank you for supporting local, shopping small, and allowing us to be part of your everyday moments and special memories.<br>
                We look forward to seeing you soon!
                </p>
            </figure>
            <figure>
            <h2>Our Philosophy</h2>
                <p>At North Star Bakery, our philosophy is simple: quality ingredients, thoughtful craftsmanship, and a commitment to our community.<br>
                We believe great baked goods begin with great ingredients, which is why we strive to use organic, ethically sourced, and high-quality products whenever possible.<br>
                From selecting responsible suppliers to preparing each item with care, we are dedicated to offering fresh, wholesome, and delicious baked goods without compromising<br>
                our values. We believe that supporting sustainable practices, treating our ingredients and suppliers with respect, and bringing people together through the simple joy<br>
                of good food are all part of what makes a bakery special. At North Star Bakery, we're not just baking treats;<br>
                we're building a tradition of quality, integrity, and community, one delicious creation at a time.
            </p>
            </figure>
